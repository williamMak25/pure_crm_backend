[project]
name = "pure-erp-api"
version = "0.1.0"
description = "Backend API for the PURE Education ERP admin dashboard."
authors = [{ name = "waiyanwinlwin", email = "waiyanwinlwin25@gmail.com" }]
requires-python = ">=3.12"
dependencies = [
  "litestar[jwt,cryptography,standard]>=2.15",
  "advanced-alchemy[uuid]>=1.4",
  "asyncpg>=0.30",
  "pwdlib[argon2]>=0.2",
  "python-dotenv>=1.0",
]

[project.scripts]
app = "app.__main__:run_cli"

[dependency-groups]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.24",
  "httpx>=0.27",
  "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"src/app/lib/env.py" = ["UP047", "E501"]  # copied as-is from litestar-fullstack
"src/app/db/migrations/**" = ["E501", "F401", "I001", "UP"]
